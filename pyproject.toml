[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "team3-formal-methods"
version = "0.1.0"
description = "Bounded real-time requirement consistency checking and MIS extraction with Z3"
requires-python = ">=3.9"
dependencies = ["z3-solver>=4.13,<6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
